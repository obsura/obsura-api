[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "obsura-api"
version = "0.1.0"
description = "Obsura API for review-first sanitization workflows, studio assets, and job orchestration."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "fastapi>=0.116.1",
  "opencv-python-headless>=4.9.0",
  "pillow>=11.2.1",
  "pypdf>=5.4.0",
  "psycopg[binary]>=3.2.9",
  "pytesseract>=0.3.13",
  "pydantic-settings>=2.8.1",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.39",
  "uvicorn>=0.34.0",
]
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "mypy>=1.19.1",
  "pre-commit>=4.5.1",
  "pytest>=8.3.5",
  "pytest-cov>=7.0.0",
  "ruff>=0.15.6",
]
presidio = [
  "presidio-analyzer>=2.2.360; python_version < '3.14'",
  "presidio-anonymizer>=2.2.360; python_version < '3.14'",
]

[project.urls]
Homepage = "https://github.com/obsura/obsura-api"
Repository = "https://github.com/obsura/obsura-api"
Issues = "https://github.com/obsura/obsura-api/issues"
Documentation = "https://github.com/obsura/obsura-api#readme"
Security = "https://github.com/obsura/obsura-api/security"

[project.scripts]
obsura-api = "obsura_api.main:main"
obsura-api-artifacts = "obsura_api.tools.api_artifacts:main"
obsura-api-migrate = "obsura_api.db.migrations:main"

[tool.hatch.build.targets.wheel]
packages = ["src/obsura_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["obsura_api"]

[tool.mypy]
python_version = "3.12"
files = [
  "src/obsura_api/api",
  "src/obsura_api/core",
  "src/obsura_api/domain",
]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
follow_imports = "silent"
ignore_missing_imports = true
no_implicit_optional = true
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["src/obsura_api"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

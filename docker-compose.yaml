services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  obsura-init-db:
    image: ${OBSURA_API_IMAGE:?OBSURA_API_IMAGE is required}
    restart: "no"
    env_file:
      - .env
    environment:
      OBSURA_ENVIRONMENT: production
      OBSURA_AUTO_CREATE_SCHEMA: "false"
    command: ["obsura-api-migrate", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777

  obsura-api:
    image: ${OBSURA_API_IMAGE:?OBSURA_API_IMAGE is required}
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      OBSURA_ENVIRONMENT: production
      OBSURA_AUTO_CREATE_SCHEMA: "false"
      OBSURA_STORAGE_ROOT: /app/storage
    depends_on:
      postgres:
        condition: service_healthy
      obsura-init-db:
        condition: service_completed_successfully
    ports:
      - ${OBSURA_BIND_HOST:-127.0.0.1}:${OBSURA_PORT:-8000}:8000
    volumes:
      - obsura_storage:/app/storage
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
  obsura_storage:
